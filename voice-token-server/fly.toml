# Fly config for the Rosey voice token server.
# Deploy:
#   fly apps create rosey-voice-token        # once
#   fly secrets set OPENAI_API_KEY=sk-...      -a rosey-voice-token
#   fly secrets set ROSEY_PWA_ORIGIN=https://rosey.family  -a rosey-voice-token
#   fly deploy -a rosey-voice-token
#
# Keep one tiny machine warm. This endpoint sits on the critical path between a
# wake gesture and the first Realtime audio turn, so cold starts are noticeable.

app = "rosey-voice-token"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8088
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

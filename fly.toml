# Single-tenant Rosey deploy on Fly.
# See https://fly.io/docs/reference/configuration/

app = 'rosey'
primary_region = 'sjc'

[build]

# Non-secret runtime config. Secrets (ANTHROPIC_API_KEY, TELEGRAM_BOT_TOKEN,
# TELEGRAM_WEBHOOK_URL, TELEGRAM_WEBHOOK_SECRET, optionally OPENAI_API_KEY)
# go through `fly secrets set` instead — they're encrypted at rest.
[env]
  MEMORY_ROOT = '/data/memories'
  SCHEDULER_TZ = 'America/Los_Angeles'

[[mounts]]
  source = 'memory_data'
  destination = '/data'

# Webhook listener + health check.
#
# We use a single [[services]] block (not [http_service]) because
# [http_service] implicitly adds an HTTP GET / health check, and the bot's
# tornado webhook server only serves /telegram — every other path returns
# 404 and the implicit check would fail forever. Defining the service
# explicitly lets us use a TCP-only check that just verifies port 8080 is
# listening (which it can only do if the bot started successfully).
# BOT webhook service — moved to external :8443 so the MCP server can own 443.
# Telegram permits webhooks on 443/80/88/8443, so :8443 is valid. After this
# change you MUST set the webhook URL to include the port:
#   fly secrets set TELEGRAM_WEBHOOK_URL=https://rosey.fly.dev:8443 -a rosey
# WhatsApp via Baileys is outbound (no webhook) so it's unaffected. NOTE: Meta
# WhatsApp Cloud API webhooks and Alexa skill endpoints REQUIRE 443 — if you
# depend on those, this swap won't work and we need path-routing instead.
[[services]]
  protocol = 'tcp'
  internal_port = 8080
  auto_stop_machines = 'off'   # reminders need a live process
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 8443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

# MCP endpoint (shared household memory) — co-located mcp_server.py on internal
# :8089, now exposed on standard 443 because OpenAI's realtime backend only
# connects to MCP servers on 443 (it silently refused the old :8443). Same
# container/volume as the engine, so all channels share one memory.
#
# SECURITY: serves real household memory, currently unauthenticated
# (see mcp_server.py). Demo posture only until per-session auth is added.
[[services]]
  protocol = 'tcp'
  internal_port = 8089
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [[services.tcp_checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  # Bumped 512 -> 1024 for headroom: bot + (optional) baileys + the MCP server
  # now share one machine. Lower it back if you confirm RAM use stays well under.
  memory_mb = 1024
